<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>{{ site_name }}</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #0a0a12;
            font-family: 'Rajdhani', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }
        
        /* Fallback background */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            z-index: 0;
            background: 
                radial-gradient(ellipse at 20% 50%, rgba(0,255,65,0.03) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 50%, rgba(168,85,247,0.03) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 100%, rgba(56,189,248,0.02) 0%, transparent 50%);
            pointer-events: none;
        }
        
        canvas {
            position: fixed;
            inset: 0;
            z-index: 0;
            opacity: 0.3;
            pointer-events: none;
        }
        
        .container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 420px;
            padding: 0 16px;
            animation: fadeIn 0.8s ease-out;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        
        .card {
            background: rgba(10, 10, 20, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 2px solid {{ theme_color }};
            border-radius: 30px;
            padding: 40px 36px;
            box-shadow: 0 0 80px {{ theme_color }}22, 0 0 160px {{ theme_color }}11;
            position: relative;
            overflow: hidden;
            transition: all 0.5s ease;
        }
        
        .card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: conic-gradient(from 0deg, transparent, {{ theme_color }}08, transparent, {{ theme_color }}08, transparent);
            animation: spin 20s linear infinite;
            pointer-events: none;
        }
        
        @keyframes spin {
            100% { transform: rotate(360deg); }
        }
        
        .card::after {
            content: '';
            position: absolute;
            inset: -2px;
            border-radius: 30px;
            padding: 2px;
            background: conic-gradient(from 0deg, {{ theme_color }}, transparent, {{ theme_color }}, transparent);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            opacity: 0;
            transition: opacity 0.5s ease;
            pointer-events: none;
        }
        
        .card:hover::after {
            opacity: 0.3;
        }
        
        .logo {
            text-align: center;
            margin-bottom: 20px;
            position: relative;
        }
        
        .logo-wrapper {
            display: inline-block;
            position: relative;
        }
        
        .logo-wrapper::before {
            content: '';
            position: absolute;
            inset: -4px;
            border-radius: 50%;
            padding: 2px;
            background: conic-gradient(from 0deg, {{ theme_color }}, transparent, {{ theme_color }}, transparent);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            animation: spin 3s linear infinite;
        }
        
        .logo img {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 3px solid {{ theme_color }};
            box-shadow: 0 0 40px {{ theme_color }}44, 0 0 80px {{ theme_color }}22;
            object-fit: cover;
            background: #000;
            transition: all 0.3s ease;
            animation: pulse 3s ease-in-out infinite;
            position: relative;
            display: block;
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.03); }
        }
        
        .logo img:hover {
            transform: scale(1.05);
            box-shadow: 0 0 60px {{ theme_color }}66;
        }
        
        /* Fallback if image fails */
        .logo-fallback {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 3px solid {{ theme_color }};
            background: {{ theme_color }}22;
            display: none;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            margin: 0 auto;
            box-shadow: 0 0 40px {{ theme_color }}44;
        }
        
        .brand {
            text-align: center;
            font-family: 'Orbitron', monospace;
            font-size: clamp(20px, 4vw, 24px);
            font-weight: 900;
            color: {{ theme_color }};
            letter-spacing: 6px;
            text-shadow: 0 0 30px {{ theme_color }};
            margin-bottom: 4px;
            position: relative;
            transition: all 0.5s ease;
        }
        
        .sub {
            text-align: center;
            font-size: clamp(10px, 2vw, 12px);
            color: {{ theme_color }}66;
            letter-spacing: 5px;
            margin-bottom: 28px;
            font-weight: 300;
            text-transform: uppercase;
        }
        
        .prompt {
            font-size: clamp(14px, 2.5vw, 16px);
            color: {{ theme_color }};
            margin-bottom: 16px;
            opacity: .85;
            font-weight: 600;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        
        .cursor {
            display: inline-block;
            width: 10px;
            height: 18px;
            background: {{ theme_color }};
            margin-left: 4px;
            vertical-align: middle;
            animation: blink 1s step-end infinite;
            flex-shrink: 0;
        }
        
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }
        
        .error-box {
            background: rgba(42, 8, 8, 0.9);
            border: 2px solid #ef4444;
            border-radius: 12px;
            padding: 12px 16px;
            font-size: clamp(12px, 1.8vw, 13px);
            color: #f87171;
            margin-bottom: 14px;
            font-weight: 500;
            animation: shake 0.5s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }
        
        .input-wrapper {
            position: relative;
            margin-bottom: 14px;
        }
        
        input {
            width: 100%;
            padding: 14px 18px;
            padding-right: 50px;
            background: rgba(0, 0, 0, 0.5);
            border: 2px solid {{ theme_color }}66;
            border-radius: 14px;
            color: {{ theme_color }};
            font-family: 'Rajdhani', sans-serif;
            font-size: clamp(15px, 2.5vw, 16px);
            outline: none;
            transition: all .3s ease;
            font-weight: 600;
            letter-spacing: 2px;
        }
        
        input:focus {
            border-color: {{ theme_color }};
            box-shadow: 0 0 30px {{ theme_color }}22, inset 0 0 20px {{ theme_color }}11;
            background: rgba(0, 0, 0, 0.7);
        }
        
        input::placeholder {
            color: {{ theme_color }}44;
            font-weight: 400;
            letter-spacing: 2px;
            font-size: clamp(13px, 2vw, 14px);
        }
        
        input.error {
            border-color: #ef4444;
            box-shadow: 0 0 30px rgba(239, 68, 68, 0.2);
        }
        
        .toggle-pw {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: {{ theme_color }}66;
            cursor: pointer;
            font-size: 20px;
            padding: 4px;
            transition: all 0.3s ease;
            z-index: 2;
            line-height: 1;
        }
        
        .toggle-pw:hover {
            color: {{ theme_color }};
            transform: translateY(-50%) scale(1.1);
        }
        
        .auth-btn {
            width: 100%;
            padding: 16px;
            background: transparent;
            border: 3px solid {{ theme_color }};
            border-radius: 14px;
            color: {{ theme_color }};
            font-family: 'Orbitron', monospace;
            font-size: clamp(12px, 2vw, 14px);
            font-weight: 700;
            letter-spacing: 4px;
            cursor: pointer;
            transition: all .3s ease;
            margin-top: 4px;
            position: relative;
            overflow: hidden;
            text-transform: uppercase;
        }
        
        .auth-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, {{ theme_color }}22, transparent);
            transition: left 0.5s ease;
        }
        
        .auth-btn:hover::before {
            left: 100%;
        }
        
        .auth-btn:hover {
            background: {{ theme_color }}11;
            box-shadow: 0 0 50px {{ theme_color }}33;
            transform: scale(1.02);
        }
        
        .auth-btn:active {
            transform: scale(0.98);
        }
        
        .auth-btn.loading {
            opacity: 0.7;
            pointer-events: none;
            position: relative;
        }
        
        .auth-btn.loading::after {
            content: '';
            position: absolute;
            width: 20px;
            height: 20px;
            border: 3px solid {{ theme_color }}33;
            border-top-color: {{ theme_color }};
            border-radius: 50%;
            animation: btnSpin 0.8s linear infinite;
            margin-left: 8px;
        }
        
        @keyframes btnSpin {
            100% { transform: rotate(360deg); }
        }
        
        .footer {
            text-align: center;
            margin-top: 24px;
            font-size: clamp(9px, 1.5vw, 10px);
            color: {{ theme_color }}44;
            letter-spacing: 2px;
            line-height: 1.8;
            font-weight: 300;
        }
        
        /* Responsive */
        @media (max-width: 480px) {
            .card {
                padding: 30px 24px;
                border-radius: 24px;
            }
            
            .logo img {
                width: 80px;
                height: 80px;
            }
            
            .logo-fallback {
                width: 80px;
                height: 80px;
                font-size: 36px;
            }
            
            input {
                padding: 12px 16px;
                padding-right: 44px;
            }
        }
        
        @media (max-width: 360px) {
            .card {
                padding: 24px 18px;
                border-radius: 20px;
            }
            
            .brand {
                letter-spacing: 3px;
                font-size: 18px;
            }
        }
        
        @media (prefers-color-scheme: dark) {
            body {
                background: #0a0a12;
            }
        }
        
        /* Reduced motion preference */
        @media (prefers-reduced-motion: reduce) {
            * {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>
    <canvas id="matrix"></canvas>
    
    <div class="container">
        <div class="card">
            <div class="logo">
                <div class="logo-wrapper">
                    <img src="https://i.ibb.co/pBg504T9/4891b6369ce9be0aaa324e60bf6ae68f.jpg" 
                         alt="{{ site_name }} Logo" 
                         onerror="this.style.display='none'; document.getElementById('logoFallback').style.display='flex'">
                    <div class="logo-fallback" id="logoFallback">🔐</div>
                </div>
            </div>
            
            <div class="brand" id="brandText">{{ site_name }}</div>
            <div class="sub">• SECURE TERMINAL v3.0 •</div>
            
            <div class="prompt">
                > ACCESS_REQUEST
                <span class="cursor" id="cursorEl"></span>
            </div>
            
            {% if error %}
            <div class="error-box">
                <span>⚠</span>
                {{ error }}
            </div>
            {% endif %}
            
            <form method="POST" id="loginForm" autocomplete="off">
                <div class="input-wrapper">
                    <input type="password" 
                           name="password" 
                           id="passwordInput"
                           placeholder="• ENTER ACCESS CODE •" 
                           required 
                           autofocus
                           autocomplete="current-password"
                           aria-label="Enter access code">
                    <button type="button" class="toggle-pw" id="togglePwBtn" aria-label="Toggle password visibility">
                        👁️
                    </button>
                </div>
                <button type="submit" class="auth-btn" id="loginBtn">⏣ AUTHENTICATE</button>
            </form>
            
            <div class="footer">
                ⛔ UNAUTHORIZED ACCESS PROHIBITED<br>
                {{ site_name }} • SECURE SYSTEMS
            </div>
        </div>
    </div>

    <script>
        (function() {
            'use strict';
            
            // ===== MATRIX EFFECT (Optimized) =====
            const canvas = document.getElementById('matrix');
            const ctx = canvas.getContext('2d');
            
            let width, height, cols, drops;
            const chars = '01アイウエオカキクケコ';
            const AC = '{{ theme_color }}';
            
            function resizeCanvas() {
                width = window.innerWidth;
                height = window.innerHeight;
                canvas.width = width;
                canvas.height = height;
                cols = Math.floor(width / 14);
                drops = Array(cols).fill(1);
            }
            
            resizeCanvas();
            
            let matrixFrameId;
            let lastMatrixTime = 0;
            const matrixInterval = 80; // ms between frames
            
            function drawMatrix(timestamp) {
                if (timestamp - lastMatrixTime >= matrixInterval) {
                    ctx.fillStyle = 'rgba(10, 10, 18, 0.05)';
                    ctx.fillRect(0, 0, width, height);
                    
                    const ac = document.querySelector('.brand')?.style.color || AC;
                    ctx.fillStyle = ac + '33';
                    ctx.font = '12px monospace';
                    
                    for (let i = 0; i < drops.length; i++) {
                        const char = chars[Math.floor(Math.random() * chars.length)];
                        ctx.fillText(char, i * 14, drops[i] * 14);
                        
                        if (drops[i] * 14 > height && Math.random() > 0.98) {
                            drops[i] = 0;
                        }
                        drops[i]++;
                    }
                    lastMatrixTime = timestamp;
                }
                matrixFrameId = requestAnimationFrame(drawMatrix);
            }
            
            // Start matrix animation
            matrixFrameId = requestAnimationFrame(drawMatrix);
            
            // Resize handler with debounce
            let resizeTimeout;
            window.addEventListener('resize', () => {
                clearTimeout(resizeTimeout);
                resizeTimeout = setTimeout(() => {
                    resizeCanvas();
                }, 250);
            });
            
            // ===== COLOR CYCLE (Slower - 2 seconds) =====
            const colors = ['#00ff41', '#a855f7', '#38bdf8', '#ef4444', '#fbbf24', '#06b6d4', '#ec4899', '#84cc16'];
            let colorIndex = 0;
            let colorInterval;
            
            function cycleColors() {
                colorIndex = (colorIndex + 1) % colors.length;
                const nc = colors[colorIndex];
                
                const brand = document.getElementById('brandText');
                const card = document.querySelector('.card');
                const btn = document.querySelector('.auth-btn');
                const prompt = document.querySelector('.prompt');
                const cursor = document.getElementById('cursorEl');
                const input = document.querySelector('input');
                const logo = document.querySelector('.logo img');
                const fallback = document.querySelector('.logo-fallback');
                const toggleBtn = document.querySelector('.toggle-pw');
                
                if (brand) {
                    brand.style.color = nc;
                    brand.style.textShadow = '0 0 30px ' + nc;
                }
                
                if (card) {
                    card.style.borderColor = nc;
                    card.style.boxShadow = '0 0 80px ' + nc + '22, 0 0 160px ' + nc + '11';
                }
                
                if (btn) {
                    btn.style.borderColor = nc;
                    btn.style.color = nc;
                }
                
                if (prompt) {
                    prompt.style.color = nc;
                }
                
                if (cursor) {
                    cursor.style.background = nc;
                }
                
                if (input) {
                    input.style.borderColor = nc + '66';
                }
                
                if (logo) {
                    logo.style.borderColor = nc;
                    logo.style.boxShadow = '0 0 40px ' + nc + '44, 0 0 80px ' + nc + '22';
                }
                
                if (fallback) {
                    fallback.style.borderColor = nc;
                    fallback.style.boxShadow = '0 0 40px ' + nc + '44';
                }
                
                if (toggleBtn) {
                    toggleBtn.style.color = nc + '66';
                }
            }
            
            // Start color cycling (slower)
            colorInterval = setInterval(cycleColors, 2000);
            
            // ===== PASSWORD TOGGLE =====
            const passwordInput = document.getElementById('passwordInput');
            const toggleBtn = document.getElementById('togglePwBtn');
            let passwordVisible = false;
            
            toggleBtn.addEventListener('click', function(e) {
                e.preventDefault();
                passwordVisible = !passwordVisible;
                passwordInput.type = passwordVisible ? 'text' : 'password';
                this.textContent = passwordVisible ? '🙈' : '👁️';
                this.setAttribute('aria-label', passwordVisible ? 'Hide password' : 'Show password');
            });
            
            // ===== FORM VALIDATION =====
            const loginForm = document.getElementById('loginForm');
            const loginBtn = document.getElementById('loginBtn');
            
            // Remove error class on input
            passwordInput.addEventListener('input', function() {
                this.classList.remove('error');
            });
            
            loginForm.addEventListener('submit', function(e) {
                const password = passwordInput.value.trim();
                
                if (!password) {
                    e.preventDefault();
                    passwordInput.classList.add('error');
                    passwordInput.focus();
                    
                    // Show error message
                    const existingError = document.querySelector('.error-box');
                    if (!existingError) {
                        const errorDiv = document.createElement('div');
                        errorDiv.className = 'error-box';
                        errorDiv.innerHTML = '<span>⚠</span> Please enter access code';
                        loginForm.insertBefore(errorDiv, loginForm.firstChild);
                        
                        setTimeout(() => {
                            errorDiv.remove();
                        }, 3000);
                    }
                    
                    setTimeout(() => {
                        passwordInput.classList.remove('error');
                    }, 3000);
                    return;
                }
                
                // Show loading state
                loginBtn.classList.add('loading');
                loginBtn.textContent = '⏣ AUTHENTICATING';
                
                // Re-enable after 5 seconds if no response
                setTimeout(() => {
                    loginBtn.classList.remove('loading');
                    loginBtn.textContent = '⏣ AUTHENTICATE';
                }, 5000);
            });
            
            // ===== KEYBOARD SHORTCUTS =====
            document.addEventListener('keydown', function(e) {
                // Escape to clear input
                if (e.key === 'Escape' && passwordInput === document.activeElement) {
                    passwordInput.value = '';
                    passwordInput.blur();
                    e.preventDefault();
                }
            });
            
            // ===== PREVENT CONTEXT MENU =====
            document.addEventListener('contextmenu', function(e) {
                if (e.target.closest('input, .auth-btn')) {
                    e.preventDefault();
                }
            });
            
            // ===== CLEANUP =====
            window.addEventListener('beforeunload', function() {
                if (matrixFrameId) {
                    cancelAnimationFrame(matrixFrameId);
                }
                if (colorInterval) {
                    clearInterval(colorInterval);
                }
            });
            
            // ===== AUTO-FOCUS ON MOBILE =====
            if ('ontouchstart' in window) {
                setTimeout(() => {
                    passwordInput.focus();
                }, 500);
            }
            
        })();
    </script>
</body>
</html>
